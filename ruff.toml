line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI намеренно использует Depends() в значениях по умолчанию.
ignore = ["B008"]

[lint.per-file-ignores]
# conftest выставляет переменные окружения до импорта приложения.
"tests/conftest.py" = ["E402"]
# Миграции генерируются Alembic — не линтуем строго.
"migrations/*" = ["E501", "I001", "UP"]
